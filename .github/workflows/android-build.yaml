name: Android Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Android Flavor to build'
        required: true
        default: 'FdroidDebug'
        type: choice
        options:
          - FdroidDebug
          - WebBeta
          - WebDebug
          - FdroidBeta
      arch:
        description: 'Target Architecture'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - arm64
          - arm32

env:
  SKIP_MAP_DOWNLOAD: true

jobs:
  build:
    name: Build Android APK (${{ inputs.flavor || 'FdroidDebug' }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build tools and C++ dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-positioning-dev \
            libqt6svg6-dev \
            optipng \
            libfreetype-dev \
            libharfbuzz-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            python3-pip \
            zlib1g-dev
          pip install "protobuf<3.21" --break-system-packages

      - name: Check out submodules
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-build-${{ inputs.flavor || 'FdroidDebug' }}

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Run Unit Tests
        shell: bash
        working-directory: android
        run: |
          FLAVOR="${{ inputs.flavor || 'FdroidDebug' }}"
          ./gradlew "test${FLAVOR}UnitTest"

      - name: Assemble APK
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          FLAVOR="${{ inputs.flavor || 'FdroidDebug' }}"
          ARCH="${{ inputs.arch || 'universal' }}"
          if [ "$ARCH" = "universal" ]; then
            echo "Building universal APK: assemble${FLAVOR} (supports all devices)"
            ./gradlew "assemble${FLAVOR}"
          else
            echo "Building flavor: assemble${FLAVOR} for arch: -P${ARCH}"
            ./gradlew -P${ARCH} "assemble${FLAVOR}"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-${{ inputs.flavor || 'FdroidDebug' }}-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
