name: Android Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '3party/**'
      - 'android/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'defines.hpp'
      - 'libs/**'
      - 'private.h'
      - 'configure.sh'
      - '.github/workflows/android*.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '3party/**'
      - 'android/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'defines.hpp'
      - 'libs/**'
      - 'private.h'
      - 'configure.sh'
      - '.github/workflows/android*.yaml'

env:
  SKIP_MAP_DOWNLOAD: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Install Python venv
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-venv

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew -Pandroidauto=true lint

  android-check:
    name: Build Android apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [WebBeta, FdroidDebug]
        include:
          - flavor: WebBeta
            arch: arm64
          - flavor: FdroidDebug
            arch: arm32
    # Cancels previous jobs if the same branch or PR was updated again.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.flavor }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build \
          qt6-base-dev \
          qt6-declarative-dev \
          qt6-positioning-dev \
          libqt6svg6-dev \
          optipng \
          libfreetype-dev \
          libharfbuzz-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          python3-pip \
          zlib1g-dev
          pip install "protobuf<3.21" --break-system-packages

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # enough to get all commits for the current day

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ matrix.flavor }}

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Compile ${{ matrix.flavor }}
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --version
          ninja --version
          ./gradlew -P${{ matrix.arch }} test${{ matrix.flavor }}UnitTest assemble${{ matrix.flavor }}

      - name: Upload ${{ matrix.flavor }} apk
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
